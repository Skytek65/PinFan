name: Daily Pinball Database Scraper

on:
  schedule:
    # Runs at 04:00 UTC every day
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape_and_update:
    name: Scrape Pinside & Update SQLite Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Full Database Extractor
        run: |
          python extract_full_database.py
          
      - name: Convert to SQLite & Generate version.json
        run: |
          python convert_to_sqlite.py
          
      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pinside_database.json pinside_database.db version.json PinFan/PinFan/pinside_database.db
          if git diff --staged --quiet; then
            echo "No database changes detected."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(db): automated database update ($TIMESTAMP) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
